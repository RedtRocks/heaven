[project]
name = "keepsake"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "openai>=3.19.2",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
voice = [
    "chatterbox-tts>=0.1.7",
    "scipy>=1.18.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
]
musetalk = [
    "kaggle>=2.2.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "unit: tests that require no database or network",
    "db: tests that require the test database",
    "slow: tests that take a long time (skipped by default)",
    "live: tests that call real APIs (skipped unless RUN_LIVE=1)",
]
addopts = "-m 'not slow'"

[tool.uv.sources]
chatterbox-tts = { git = "https://github.com/resemble-ai/chatterbox.git", rev = "5de7a54aa4e5e2baadb0182dde554908b48b85c2" }
